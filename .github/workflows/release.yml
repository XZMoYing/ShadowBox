name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: 'macos-15', system: 'macos', arch: 'arm64' }
          - { os: 'macos-15-intel', system: 'macos', arch: 'x64' }
          - { os: 'windows-2025', system: 'windows', arch: 'x64' }
          - { os: 'windows-11-arm', system: 'windows', arch: 'arm64' }
          - { os: 'ubuntu-24.04', system: 'linux', arch: 'x64' }
          - { os: 'ubuntu-24.04-arm', system: 'linux', arch: 'arm64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: service/go.sum

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tray/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/tray/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'

      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config unzip \
            libgtk-3-dev libayatana-appindicator3-dev liblzma-dev

      # The stable Flutter Linux SDK ships an x64 Dart toolchain only. On the
      # arm64 runner, swap in the matching ARM64 Dart SDK published by the same
      # engine so the toolchain runs natively. The engine stamp already matches
      # engine-dart-sdk.stamp, so the tool will not re-download the x64 SDK.
      - name: Install Flutter (Linux arm64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o flutter.tar.xz \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.7-stable.tar.xz
          mkdir -p "$HOME/flutter"
          tar -xf flutter.tar.xz -C "$HOME/flutter" --strip-components=1
          engine=$(cat "$HOME/flutter/bin/internal/engine.version")
          curl -fsSL -o dart-sdk-arm64.zip \
            "https://storage.googleapis.com/flutter_infra_release/flutter/$engine/dart-sdk-linux-arm64.zip"
          rm -rf "$HOME/flutter/bin/cache/dart-sdk"
          unzip -q dart-sdk-arm64.zip -d "$HOME/flutter/bin/cache"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/cache/dart-sdk/bin/dart" --version

      - uses: subosito/flutter-action@v2
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/pubspec.lock') }}

      - name: MinGW C compiler (Windows x64)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          install: mingw-w64-x86_64-gcc
          update: true

      - name: MinGW on PATH (Windows x64)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      # Go CGO for windows/arm64 needs an aarch64 C toolchain; llvm-mingw is the
      # supported prebuilt one (MinGW itself has no ARM64 target).
      - name: llvm-mingw C compiler (Windows arm64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $tag = '20261006'
          $root = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-aarch64.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath $root -Force
          $clang = Get-ChildItem -Path $root -Recurse -Filter 'aarch64-w64-mingw32-clang.exe' | Select-Object -First 1
          if (!$clang) { throw 'llvm-mingw aarch64 clang not found' }
          "$($clang.Directory.Parent.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=aarch64-w64-mingw32-clang' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build desktop package
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then python3 scripts/build.py; else python scripts/build.py; fi

      # The portable ZIP is the primary Windows asset; the installer is a bonus.
      - name: Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler not found' }
          $define = '${{ matrix.arch }}' -eq 'arm64' ? '/DSBArch=arm64' : '/DSBArch=x64'
          & $compiler $define scripts/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release assets
        shell: bash
        run: |
          set -euxo pipefail
          sys="${{ matrix.system }}"
          arch="${{ matrix.arch }}"
          mkdir -p stage
          case "$sys" in
            macos)
              cp "dist/macos-$arch/ShadowBox-0.1.0.dmg" "stage/ShadowBox-0.1.0-macos-$arch.dmg"
              ;;
            windows)
              cp "dist/windows-$arch/ShadowBox-0.1.0.zip" "stage/ShadowBox-0.1.0-windows-$arch.zip"
              for setup in dist/windows-$arch/ShadowBox-0.1.0-Setup*.exe; do
                [ -e "$setup" ] && cp "$setup" "stage/ShadowBox-0.1.0-windows-$arch-Setup.exe"
              done
              ;;
            linux)
              cp "dist/linux-$arch/ShadowBox-0.1.0.tar.gz" "stage/ShadowBox-0.1.0-linux-$arch.tar.gz"
              cp "dist/linux-$arch/ShadowBox-0.1.0.deb" \
                "stage/ShadowBox-0.1.0-linux-${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}.deb"
              ;;
          esac
          ls -la stage/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.system }}-${{ matrix.arch }}
          path: stage/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ShadowBox ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: assets/*
          fail_on_unmatched_files: true
